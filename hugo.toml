baseURL = 'https://mattischrome.com/'
locale = 'en-gb'
title = 'mattischrome'
theme = 'marginalia'

[menus]
  [[menus.main]]
    name = 'Home'
    pageRef = '/'
    weight = 10
  [[menus.main]]
    name = 'Tags'
    pageRef = '/tags'
    weight = 30
  [[menus.main]]
    name = 'Search'
    url = '/search/'
    weight = 40

# Posts per page on the home page and on category/tag listings
# (Hugo's own setting; the default is 10).
[pagination]
  pagerSize = 12

[params]
  tableOfContents = false
  math = false
  recent_posts = true
  recent_posts_count = 6
  show_post_footer = true
  fleuron_image = '/images/divider.svg'
  rss = true
  source_url = 'https://github.com/mattischrome/console-blog'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['$$', '$$']]
          inline = [['\(', '\)']]
